<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dr. Ashraf Badr Pharmacy</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top, #164b78 0%, transparent 45%),
                linear-gradient(135deg, #041226, #082c4d);

            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;

            overflow-x: hidden;
        }

        /* Main Card */
        .card {
            width: 100%;
            max-width: 480px;

            padding: 35px 22px;

            border-radius: 28px;

            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.4);

            backdrop-filter: blur(18px);

            text-align: center;

            animation: cardAppear 0.8s ease-out;
        }

        /* Logo */
        .logo {
            width: 125px;
            height: 125px;

            object-fit: contain;

            border-radius: 50%;

            background: white;

            padding: 5px;

            margin-bottom: 15px;

            box-shadow: 0 10px 30px rgba(0,0,0,0.3);

            animation: logoAppear 1s ease-out;
        }

        /* Title */
        h1 {
            margin: 5px 0 8px;

            font-size: 29px;

            animation: fadeUp 0.8s ease-out;
        }

        .subtitle {
            margin: 0 0 30px;

            font-size: 16px;

            opacity: 0.7;

            animation: fadeUp 1s ease-out;
        }

        /* Sections */
        .section {
            margin-top: 28px;

            text-align: left;

            animation: fadeUp 0.8s ease-out;
        }

        .section-title {
            text-align: center;

            font-size: 17px;

            margin-bottom: 13px;

            color: #ffffff;

            font-weight: bold;
        }

        .section-title span {
            opacity: 0.7;
        }
