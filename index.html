<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dr. Ashraf Badr Pharmacy</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #06152b, #0b3155);
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 480px;

            padding: 30px 22px;

            border-radius: 25px;

            background: rgba(255, 255, 255, 0.08);

            border: 1px solid rgba(255, 255, 255, 0.18);

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);

            text-align: center;

            animation: appear 0.8s ease;
        }

        .logo {
            width: 120px;
            height: 120px;

            object-fit: contain;

            border-radius: 50%;

            margin-bottom: 15px;

            background: white;

            animation: logo 0.8s ease;
        }

        h1 {
            font-size: 28px;
            margin: 5px 0 8px;
        }

        .subtitle {
            font-size: 16px;
            opacity: 0.75;
            margin-bottom: 30px;
        }

        .section {
            margin-top: 25px;

            animation: sectionAppear 0.7s ease both;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;

            margin-bottom: 12px;
        }

        .buttons {
            display: flex;
            flex-direction: column;

            gap: 12px;
        }

        .button {
            display: block;

            width: 100%;

            padding: 16px;

            border-radius: 15px;

            color: white;

            text-decoration: none;

            font-size: 17px;

            font-weight: bold;

            background: rgba(255, 255, 255, 0.12);

            border: 1px solid rgba(255, 255, 255, 0.18);

            transition: 0.25s;
        }

        .button:hover {
            background: rgba(255, 255, 255, 0.22);

            transform: translateY(-3px);
        }

        .button:active {
            transform: scale(0.97);
        }

        .review {
            background: #4285f4;

            border: none;
        }

        .review:hover {
            background: #357ae8;
        }

        .footer {
            margin-top: 25px;

            font-size: 13px;

            opacity: 0.5;
        }


        /* Animations */

        @keyframes appear {

            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        @keyframes logo {

            from {
                opacity: 0;
                transform: scale(0.6);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }

        }

        @keyframes sectionAppear {

            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

    </style>
</head>


<body>

    <div class="card">

        <img
            src="logo.jpg"
            alt="Dr. Ashraf Badr Pharmacy Logo"
            class="logo"
        >

        <h1>
            Dr. Ashraf Badr Pharmacy
        </h1>

        <p class="subtitle">
            Your health is our priority
        </p>


        <!-- CONTACT -->

        <div class="section">

            <div class="section-title">
                📞 Contact Us
            </div>

            <div class="buttons">

                <a
                    class="button"
                    href="https://maps.app.goo.gl/mPXNBf4XXBj1M6J39"
                >
                    📍 Find Our Location
                </a>

                <a
                    class="button"
                    href="tel:01227968585"
                >
                    📞 Call Us
                </a>

                <a
                    class="button"
                    href="https://wa.me/201158771600"
                >
                    💬 WhatsApp
                </a>

            </div>

        </div>


        <!-- SOCIAL MEDIA -->

        <div class="section">

            <div class="section-title">
                🌐 Follow Us on Social Media
            </div>

            <div class="buttons">

                <a
                    class="button"
                    href="https://www.tiktok.com/@dr..ashraf.badr.p"
                >
                    🎵 TikTok
                </a>

                <a
                    class="button"
                    href="https://www.facebook.com/share/19Yt9Wzjpy/"
                >
                    📘 Facebook
                </a>

                <a
                    class="button"
                    href="https://www.instagram.com/dr.ashrafbadr"
                >
                    📷 Instagram
                </a>

            </div>

        </div>


        <!-- GOOGLE REVIEW -->

        <div class="section">

            <div class="section-title">
                ⭐ Rate Us on Google
            </div>

            <div class="buttons">

                <a
                    class="button review"
                    href="https://search.google.com/local/writereview?placeid=ChIJaa8srbc-WBQR9-FhP7xNOA0"
                >
                    ⭐ Leave a Google Review
                </a>

            </div>

        </div>


        <div class="footer">
            Dr. Ashraf Badr Pharmacy
        </div>

    </div>

</body>
</html>
