<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dr. Ashraf Badr Pharmacy</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #071b33, #0b3150, #071b33);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: white;
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 30px 22px;
      border-radius: 25px;

      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);

      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);

      text-align: center;
    }

    .logo {
      width: 130px;
      height: 130px;
      object-fit: contain;
      border-radius: 50%;
      background: white;
      padding: 8px;
      margin-bottom: 18px;

      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
    }

    h1 {
      font-size: 26px;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 16px;
      opacity: 0.8;
      margin-bottom: 25px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .btn {
      width: 100%;
      min-height: 58px;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      border-radius: 15px;

      color: white;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;

      transition: transform 0.2s ease,
                  opacity 0.2s ease,
                  box-shadow 0.2s ease;

      box-shadow: 0 7px 18px rgba(0, 0, 0, 0.2);
    }

    .btn:hover {
      transform: translateY(-2px);
      opacity: 0.92;
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.3);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .icon {
      font-size: 23px;
      width: 28px;
      text-align: center;
    }

    /* Main buttons */

    .location {
      background: #1683ff;
    }

    .call {
      background: #16a34a;
    }

    .whatsapp {
      background: #25d366;
    }

    /* Social buttons */

    .tiktok {
      background: #111111;
    }

    .facebook {
      background: #1877f2;
    }

    .instagram {
      background: #c13584;
    }

    /* Google Review */

    .google-review {
      background: #4285f4;
    }

    .social-title {
      margin: 25px 0 13px;
      font-size: 15px;
      opacity: 0.75;
    }

    .review-title {
      margin: 25px 0 13px;
      font-size: 15px;
      opacity: 0.75;
    }

    .footer {
      margin-top: 25px;
      font-size: 13px;
      opacity: 0.55;
    }
